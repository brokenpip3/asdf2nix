repos:
- repo: https://github.com/pre-commit/pre-commit-hooks
  rev: 3e8a8703264a2f4a69428a0aa4dcb512790b2c8c  # frozen: v6.0.0
  hooks:
  - id: end-of-file-fixer
  - id: trailing-whitespace
  - id: check-toml
- repo: https://github.com/python-jsonschema/check-jsonschema
  rev: 943377262562a12b57292fc98fabd7dbf81451fe  # frozen: 0.37.2
  hooks:
    - id: check-dependabot
    - id: check-github-workflows
      args: ["--verbose"]

- repo: https://github.com/asottile/reorder-python-imports
  rev: 7885866bd38c852b5e042c4aeef0285d715ffeee  # frozen: v3.16.0
  hooks:
  -   id: reorder-python-imports

- repo: https://github.com/psf/black
  rev: 87928e6d6761a4a6d22250e1fee5601b3998086e  # frozen: 26.5.1
  hooks:
  -   id: black

- repo: https://github.com/brokenpip3/pre-commit-hooks
  rev: dd7b3821637ba3c3a8628ad487fd84edec8006f2  # frozen: 0.0.1
  hooks:
    - id: github-actions-hash
      files: ^.github/workflows/.*\.(yml|yaml)$ # limit only to github workflows

- repo: local
  hooks:
  - id: pytest-check
    name: pytest-check
    types: [python]
    files: ^jcli/
    entry: pytest -v -s .
    language: system
    pass_filenames: false
